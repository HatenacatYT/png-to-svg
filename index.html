<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像 to SVG 変換ツール (Raster to SVG Vectorizer)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ImageTracerJS CDN for Client-side Vectorization -->
  <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    code, textarea, .font-mono {
      font-family: 'Fira Code', monospace;
    }
    /* 透明画像のチェック柄背景 */
    .bg-checkerboard {
      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-color: #0f172a;
    }
    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="p-2.5 bg-indigo-600 rounded-xl text-white shadow-lg shadow-indigo-500/20">
        <i data-lucide="sparkles" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">
          画像 to SVG コンバーター
        </h1>
        <p class="text-xs text-slate-400">サーバー送信なし・ブラウザ内で完結するベクター化ツール</p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full font-medium flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        GitHub Pages 対応
      </span>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 p-4 md:p-6 max-w-[1600px] w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- 左カラム: 操作パネルと設定 -->
    <section class="lg:col-span-4 flex flex-col gap-6">

      <!-- ファイルドロップエリア -->
      <div class="bg-slate-900 border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-2xl p-6 transition text-center cursor-pointer group relative overflow-hidden" id="drop-zone">
        <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
        <div class="flex flex-col items-center justify-center space-y-3 py-4">
          <div class="w-14 h-14 bg-slate-800 group-hover:bg-indigo-600/20 group-hover:text-indigo-400 text-slate-400 rounded-2xl flex items-center justify-center transition border border-slate-700 group-hover:border-indigo-500/50">
            <i data-lucide="upload-cloud" class="w-7 h-7"></i>
          </div>
          <div>
            <p class="text-sm font-semibold text-slate-200 group-hover:text-indigo-300">画像をドラッグ＆ドロップ</p>
            <p class="text-xs text-slate-400 mt-1">またはクリックしてファイル選択 (PNG, WEBP, JPEG)</p>
          </div>
        </div>
      </div>

      <!-- トレース設定パネル -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-5">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h2 class="font-bold text-slate-200 flex items-center gap-2">
            <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i>
            ベクター化パラメータ設定
          </h2>
          <button id="reset-params" class="text-xs text-slate-400 hover:text-white transition">初期値に戻す</button>
        </div>

        <!-- カラーモード選択 -->
        <div class="space-y-2">
          <label class="text-xs font-semibold text-slate-300 block">カラーモード</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="btn-color-full" class="param-mode-btn bg-indigo-600 text-white text-xs font-medium py-2 px-3 rounded-lg transition flex items-center justify-center gap-1.5 border border-indigo-500">
              <i data-lucide="palette" class="w-3.5 h-3.5"></i>
              フルカラー
            </button>
            <button type="button" id="btn-color-mono" class="param-mode-btn bg-slate-800 text-slate-400 hover:text-white text-xs font-medium py-2 px-3 rounded-lg transition flex items-center justify-center gap-1.5 border border-slate-700">
              <i data-lucide="contrast" class="w-3.5 h-3.5"></i>
              白黒シルエット
            </button>
          </div>
        </div>

        <!-- 色数（カラーモード用） -->
        <div id="colors-control" class="space-y-2">
          <div class="flex justify-between items-center text-xs">
            <label for="param-colors" class="font-semibold text-slate-300">使用色数 (階調数)</label>
            <span id="val-colors" class="font-mono text-indigo-400 font-bold">16</span>
          </div>
          <input type="range" id="param-colors" min="2" max="64" value="16" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
          <div class="flex justify-between text-[10px] text-slate-500">
            <span>2色 (シンプル)</span>
            <span>64色 (高精細)</span>
          </div>
        </div>

        <!-- 詳細度 (Scale / Detail) -->
        <div class="space-y-2">
          <div class="flex justify-between items-center text-xs">
            <label for="param-detail" class="font-semibold text-slate-300">パスの精度・詳細度</label>
            <span id="val-detail" class="font-mono text-indigo-400 font-bold">1.0</span>
          </div>
          <input type="range" id="param-detail" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
        </div>

        <!-- ぼかし・ノイズ除去 (Blur Radius) -->
        <div class="space-y-2">
          <div class="flex justify-between items-center text-xs">
            <label for="param-blur" class="font-semibold text-slate-300">輪郭の平滑化 (Blur)</label>
            <span id="val-blur" class="font-mono text-indigo-400 font-bold">0</span>
          </div>
          <input type="range" id="param-blur" min="0" max="5" step="1" value="0" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
        </div>

        <!-- トレース実行ボタン -->
        <button id="convert-btn" disabled class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-600 disabled:cursor-not-allowed text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
          <i data-lucide="refresh-cw" class="w-4 h-4" id="convert-spinner"></i>
          <span>SVGに再変換</span>
        </button>
      </div>

    </section>

    <!-- 右カラム: プレビュー & コード出力 -->
    <section class="lg:col-span-8 flex flex-col gap-6">

      <!-- 画像 プレビュー比較エリア -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col gap-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h2 class="font-bold text-slate-200 flex items-center gap-2">
            <i data-lucide="eye" class="w-4 h-4 text-indigo-400"></i>
            リアルタイムプレビュー比較
          </h2>
          <span id="status-badge" class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">
            画像未選択
          </span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- 元画像 -->
          <div class="space-y-2">
            <span class="text-xs font-semibold text-slate-400 block">元画像 (ラスター)</span>
            <div class="h-64 md:h-80 rounded-xl bg-checkerboard border border-slate-800 flex items-center justify-center overflow-hidden p-2 relative">
              <img id="img-original" class="max-w-full max-h-full object-contain hidden" alt="元画像">
              <div id="placeholder-orig" class="text-center text-slate-600 space-y-1">
                <i data-lucide="image" class="w-8 h-8 mx-auto stroke-1"></i>
                <p class="text-xs">元画像が表示されます</p>
              </div>
            </div>
          </div>

          <!-- 生成SVG -->
          <div class="space-y-2">
            <span class="text-xs font-semibold text-slate-400 block">変換後のSVG (ベクター)</span>
            <div class="h-64 md:h-80 rounded-xl bg-checkerboard border border-slate-800 flex items-center justify-center overflow-hidden p-2 relative">
              <div id="svg-container" class="w-full h-full flex items-center justify-center [&>svg]:max-w-full [&>svg]:max-h-full [&>svg]:h-auto"></div>
              <div id="placeholder-svg" class="text-center text-slate-600 space-y-1">
                <i data-lucide="vector" class="w-8 h-8 mx-auto stroke-1"></i>
                <p class="text-xs">ここにSVGが生成されます</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- SVGコード Inspector / テキストエリア -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col gap-4">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-3">
          <h2 class="font-bold text-slate-200 flex items-center gap-2">
            <i data-lucide="code" class="w-4 h-4 text-indigo-400"></i>
            SVGコード出力
          </h2>

          <div class="flex items-center gap-2">
            <!-- コピーボタン -->
            <button id="btn-copy" disabled class="bg-slate-800 hover:bg-slate-700 text-slate-300 disabled:opacity-50 text-xs font-semibold px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
              <i data-lucide="copy" class="w-3.5 h-3.5"></i>
              コードをコピー
            </button>
            <!-- ダウンロードボタン -->
            <button id="btn-download" disabled class="bg-emerald-600 hover:bg-emerald-500 text-white disabled:opacity-50 text-xs font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-1.5">
              <i data-lucide="download" class="w-3.5 h-3.5"></i>
              SVG保存
            </button>
          </div>
        </div>

        <!-- SVG テキストエリア -->
        <div class="relative">
          <textarea id="svg-output" readonly placeholder="<!-- 画像をアップロードすると、ここに完全なSVGコードが表示されます -->" class="w-full h-48 bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-indigo-300 leading-relaxed resize-none focus:outline-none focus:border-indigo-500/50 transition"></textarea>
        </div>
      </div>

    </section>

  </main>

  <!-- トースト通知 -->
  <div id="toast" class="fixed bottom-6 right-6 bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-sm font-medium translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50">
    <i data-lucide="check-circle" class="w-4 h-4"></i>
    <span id="toast-msg">コピーしました！</span>
  </div>

  <script>
    // アイコン初期化
    lucide.createIcons();

    // DOM要素の参照
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const imgOriginal = document.getElementById('img-original');
    const svgContainer = document.getElementById('svg-container');
    const svgOutput = document.getElementById('svg-output');
    const placeholderOrig = document.getElementById('placeholder-orig');
    const placeholderSvg = document.getElementById('placeholder-svg');
    const statusBadge = document.getElementById('status-badge');
    const convertBtn = document.getElementById('convert-btn');
    const convertSpinner = document.getElementById('convert-spinner');
    const btnCopy = document.getElementById('btn-copy');
    const btnDownload = document.getElementById('btn-download');

    // コントロール
    const paramColors = document.getElementById('param-colors');
    const valColors = document.getElementById('val-colors');
    const paramDetail = document.getElementById('param-detail');
    const valDetail = document.getElementById('val-detail');
    const paramBlur = document.getElementById('param-blur');
    const valBlur = document.getElementById('val-blur');
    const btnColorFull = document.getElementById('btn-color-full');
    const btnColorMono = document.getElementById('btn-color-mono');
    const colorsControl = document.getElementById('colors-control');

    // 状態管理
    let currentImageSrc = null;
    let isMonochrome = false;
    let originalFileName = 'vectorized';

    // スライダーの値表示更新
    paramColors.addEventListener('input', () => valColors.textContent = paramColors.value);
    paramDetail.addEventListener('input', () => valDetail.textContent = paramDetail.value);
    paramBlur.addEventListener('input', () => valBlur.textContent = paramBlur.value);

    // カラーモード切り替え
    btnColorFull.addEventListener('click', () => {
      isMonochrome = false;
      btnColorFull.className = 'param-mode-btn bg-indigo-600 text-white text-xs font-medium py-2 px-3 rounded-lg transition flex items-center justify-center gap-1.5 border border-indigo-500';
      btnColorMono.className = 'param-mode-btn bg-slate-800 text-slate-400 hover:text-white text-xs font-medium py-2 px-3 rounded-lg transition flex items-center justify-center gap-1.5 border border-slate-700';
      colorsControl.style.display = 'block';
    });

    btnColorMono.addEventListener('click', () => {
      isMonochrome = true;
      btnColorMono.className = 'param-mode-btn bg-indigo-600 text-white text-xs font-medium py-2 px-3 rounded-lg transition flex items-center justify-center gap-1.5 border border-indigo-500';
      btnColorFull.className = 'param-mode-btn bg-slate-800 text-slate-400 hover:text-white text-xs font-medium py-2 px-3 rounded-lg transition flex items-center justify-center gap-1.5 border border-slate-700';
      colorsControl.style.display = 'none';
    });

    // ドラッグ＆ドロップ処理
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('border-indigo-500', 'bg-indigo-500/10');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-indigo-500', 'bg-indigo-500/10');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length > 0) handleFile(files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    // 画像読み込みと処理
    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        showToast('画像ファイルを選択してください');
        return;
      }

      originalFileName = file.name.replace(/\.[^/.]+$/, "");

      const reader = new FileReader();
      reader.onload = (e) => {
        currentImageSrc = e.target.result;
        imgOriginal.src = currentImageSrc;
        imgOriginal.classList.remove('hidden');
        placeholderOrig.classList.add('hidden');
        convertBtn.disabled = false;
        
        // 自動的に初回変換を実行
        vectorizeImage();
      };
      reader.readAsDataURL(file);
    }

    // ImageTracerJSを用いたベクター変換処理
    function vectorizeImage() {
      if (!currentImageSrc) return;

      statusBadge.textContent = 'SVG変換中...';
      statusBadge.className = 'text-xs bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full border border-indigo-500/40 animate-pulse';
      convertSpinner.classList.add('animate-spin');

      setTimeout(() => {
        // オプションパラメータ設定
        const options = {
          corsenabled: false,
          ltres: parseFloat(paramDetail.value),
          qtres: parseFloat(paramDetail.value),
          pathomit: 8,
          blurradius: parseInt(paramBlur.value),
          blurdelta: 20
        };

        if (isMonochrome) {
          options.numberofcolors = 2;
          options.pal = [{r:0,g:0,b:0,a:255}, {r:255,g:255,b:255,a:255}];
        } else {
          options.numberofcolors = parseInt(paramColors.value);
        }

        try {
          // ImageTracerJSの実行
          ImageTracer.imageToSVG(
            currentImageSrc,
            function(svgStr) {
              // DOMに反映
              svgContainer.innerHTML = svgStr;
              svgOutput.value = svgStr;
              placeholderSvg.classList.add('hidden');

              // ボタンを有効化
              btnCopy.disabled = false;
              btnDownload.disabled = false;

              statusBadge.textContent = '変換完了';
              statusBadge.className = 'text-xs bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full border border-emerald-500/40';
              convertSpinner.classList.remove('animate-spin');
            },
            options
          );
        } catch (err) {
          console.error(err);
          statusBadge.textContent = 'エラーが発生しました';
          statusBadge.className = 'text-xs bg-rose-500/20 text-rose-300 px-3 py-1 rounded-full border border-rose-500/40';
          convertSpinner.classList.remove('animate-spin');
        }
      }, 50);
    }

    // 再変換ボタン
    convertBtn.addEventListener('click', vectorizeImage);

    // リセットボタン
    document.getElementById('reset-params').addEventListener('click', () => {
      paramColors.value = 16;
      valColors.textContent = '16';
      paramDetail.value = 1.0;
      valDetail.textContent = '1.0';
      paramBlur.value = 0;
      valBlur.textContent = '0';
      btnColorFull.click();
      if (currentImageSrc) vectorizeImage();
    });

    // SVGコードコピー機能
    btnCopy.addEventListener('click', () => {
      if (!svgOutput.value) return;
      
      // execCommand fallback & Clipboard API
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(svgOutput.value);
      } else {
        svgOutput.select();
        document.execCommand('copy');
      }
      showToast('SVGコードをコピーしました！');
    });

    // SVGファイルダウンロード機能
    btnDownload.addEventListener('click', () => {
      if (!svgOutput.value) return;

      const blob = new Blob([svgOutput.value], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${originalFileName}_vectorized.svg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('SVGファイルをダウンロードしました！');
    });

    // トースト表示機能
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.textContent = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }
  </script>
</body>
</html>
