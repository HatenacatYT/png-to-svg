<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PNG/WebP to SVG 高性能変換ツール</title>
  <!-- ImageTracer.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/imagetracerjs/1.2.6/imagetracer.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 900px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
      color: #2c3e50;
    }
    .file-input-area {
      border: 2px dashed #3498db;
      padding: 30px;
      text-align: center;
      border-radius: 8px;
      background: #f8fbfe;
      cursor: pointer;
      transition: background 0.3s;
      margin-bottom: 20px;
    }
    .file-input-area:hover {
      background: #ebf5fb;
    }
    input[type="file"] {
      display: none;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: #fdfdfd;
      padding: 10px;
      border: 1px solid #eee;
      border-radius: 6px;
    }
    label {
      font-size: 0.85rem;
      font-weight: bold;
      color: #555;
    }
    select, input[type="range"] {
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #2980b9;
    }
    .btn:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }
    .preview-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 25px;
    }
    @media (max-width: 600px) {
      .preview-section {
        grid-template-columns: 1fr;
      }
    }
    .preview-box {
      border: 1px solid #eee;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      background: #fafafa;
    }
    .preview-box h3 {
      font-size: 0.95rem;
      margin-bottom: 10px;
      color: #666;
    }
    .preview-box img, .preview-box svg {
      max-width: 100%;
      max-height: 250px;
      height: auto;
      object-fit: contain;
    }
    #svgContainer {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .download-area {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>PNG / WebP → SVG 高性能変換ツール</h1>

    <!-- ファイル選択エリア -->
    <div class="file-input-area" onclick="document.getElementById('fileInput').click()">
      <p id="fileLabel">クリックして画像を選択 (PNG, WebP, JPG)</p>
      <input type="file" id="fileInput" accept="image/png, image/webp, image/jpeg">
    </div>

    <!-- 高度な設定項目 -->
    <div class="controls">
      <div class="control-group">
        <label for="preset">プリセット</label>
        <select id="preset">
          <option value="default">標準 (Default)</option>
          <option value="detailed">高精度・多め (Detailed)</option>
          <option value="bw">白黒・シルエット (Black & White)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="numberofcolors">最大色数: <span id="colorVal">16</span></label>
        <input type="range" id="numberofcolors" min="2" max="64" value="16">
      </div>

      <div class="control-group">
        <label for="pathomit">ノイズ除去 (最小パス): <span id="omitVal">8</span>px</label>
        <input type="range" id="pathomit" min="0" max="50" value="8">
      </div>

      <div class="control-group">
        <label for="maxDimension">高速化リサイズ (最大幅/高さ): <span id="dimVal">800</span>px</label>
        <input type="range" id="maxDimension" min="200" max="2000" step="100" value="800">
      </div>
    </div>

    <button id="convertBtn" class="btn" disabled>SVGへ変換する</button>

    <!-- プレビュー表示エリア -->
    <div class="preview-section" id="previewSection" style="display: none;">
      <div class="preview-box">
        <h3>元の画像 (最適化後)</h3>
        <img id="originalPreview" alt="Original Image">
      </div>
      <div class="preview-box">
        <h3>変換後の SVG</h3>
        <div id="svgContainer"></div>
      </div>
    </div>

    <!-- ダウンロードボタン -->
    <div class="download-area" id="downloadArea" style="display: none;">
      <button id="downloadBtn" class="btn" style="background-color: #2ecc71;">SVGをダウンロード</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const convertBtn = document.getElementById('convertBtn');
    const originalPreview = document.getElementById('originalPreview');
    const svgContainer = document.getElementById('svgContainer');
    const previewSection = document.getElementById('previewSection');
    const downloadArea = document.getElementById('downloadArea');
    const downloadBtn = document.getElementById('downloadBtn');
    
    const presetSelect = document.getElementById('preset');
    const colorsRange = document.getElementById('numberofcolors');
    const colorVal = document.getElementById('colorVal');
    const omitRange = document.getElementById('pathomit');
    const omitVal = document.getElementById('omitVal');
    const maxDimRange = document.getElementById('maxDimension');
    const dimVal = document.getElementById('dimVal');

    let currentImageDataUrl = '';
    let currentSvgString = '';

    // スライダーの値表示リアルタイム更新
    colorsRange.addEventListener('input', (e) => colorVal.textContent = e.target.value);
    omitRange.addEventListener('input', (e) => omitVal.textContent = e.target.value);
    maxDimRange.addEventListener('input', (e) => dimVal.textContent = e.target.value);

    // ファイル選択時にCanvasで自動リサイズ（高速化＆メモリ対策）
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileLabel.textContent = `選択中: ${file.name}`;
      const reader = new FileReader();
      
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = parseInt(maxDimRange.value, 10);

          // 指定サイズより大きければ縮小して高速化
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          currentImageDataUrl = canvas.toDataURL('image/png');
          originalPreview.src = currentImageDataUrl;
          previewSection.style.display = 'grid';
          svgContainer.innerHTML = '';
          downloadArea.style.display = 'none';
          convertBtn.disabled = false;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 変換処理
    convertBtn.addEventListener('click', () => {
      if (!currentImageDataUrl) return;

      convertBtn.disabled = true;
      convertBtn.textContent = '変換中...';

      // 詳細なオプション設定
      const options = {
        numberofcolors: parseInt(colorsRange.value, 10),
        pathomit: parseInt(omitRange.value, 10),
        strokewidth: 1,
        ltres: 1,
        qtres: 1
      };

      if (presetSelect.value === 'bw') {
        options.numberofcolors = 2;
        options.colorquantcycles = 1;
      } else if (presetSelect.value === 'detailed') {
        options.ltres = 0.5;
        options.qtres = 0.5;
      }

      // 非同期でフリーズを防ぎながらトレース実行
      setTimeout(() => {
        ImageTracer.imageToSVG(
          currentImageDataUrl,
          function(svgStr) {
            currentSvgString = svgStr;
            svgContainer.innerHTML = svgStr;
            
            const svgEl = svgContainer.querySelector('svg');
            if (svgEl) {
              svgEl.style.maxWidth = '100%';
              svgEl.style.height = 'auto';
            }

            downloadArea.style.display = 'block';
            convertBtn.disabled = false;
            convertBtn.textContent = 'SVGへ再変換する';
          },
          options
        );
      }, 50);
    });

    // ダウンロード
    downloadBtn.addEventListener('click', () => {
      if (!currentSvgString) return;
      const blob = new Blob([currentSvgString], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'converted.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
